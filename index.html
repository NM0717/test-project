<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的待办清单</title>
    <style>
        :root {
            /* 莫兰迪配色 */
            --bg: #f2efe9;              /* 暖米白背景 */
            --card: #ffffff;            /* 卡片白 */
            --primary: #8b9da8;         /* 雾霾蓝 */
            --primary-deep: #6b7f8c;    /* 深雾霾蓝 */
            --accent: #c7a8a3;          /* 灰粉 */
            --text: #4a4a48;            /* 深灰文字 */
            --text-muted: #a8a49c;      /* 浅灰文字 */
            --done: #c0bcb4;            /* 完成态灰色 */
            --danger: #c98f8b;          /* 柔和红（删除） */
            --border: #e4dfd6;          /* 柔和边框 */
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, "PingFang SC", "Segoe UI", "Microsoft YaHei", sans-serif;
            background: var(--bg);
            display: flex;
            justify-content: center;
            padding: 56px 20px;
            min-height: 100vh;
            color: var(--text);
        }

        .container {
            width: 100%;
            max-width: 480px;
        }

        .header {
            margin-bottom: 32px;
        }

        h1 {
            font-size: 28px;
            font-weight: 500;
            color: var(--text);
            letter-spacing: 1px;
            text-align: center;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            font-size: 13px;
            color: var(--text-muted);
            letter-spacing: 2px;
        }

        .input-card {
            background: var(--card);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 24px;
            box-shadow: 0 4px 20px rgba(139, 157, 168, 0.08);
            display: flex;
            gap: 10px;
        }

        #task-input {
            flex: 1;
            padding: 12px 14px;
            font-size: 15px;
            border: 1px solid var(--border);
            border-radius: 12px;
            outline: none;
            background: #faf9f6;
            color: var(--text);
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        #task-input::placeholder {
            color: var(--text-muted);
        }

        #task-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(139, 157, 168, 0.15);
        }

        #add-btn {
            padding: 12px 22px;
            font-size: 15px;
            background: var(--primary);
            color: #fff;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            letter-spacing: 1px;
            transition: background 0.2s, transform 0.1s;
        }

        #add-btn:hover {
            background: var(--primary-deep);
        }

        #add-btn:active {
            transform: scale(0.97);
        }

        ul {
            list-style: none;
        }

        li {
            display: flex;
            align-items: center;
            gap: 14px;
            background: var(--card);
            padding: 16px 18px;
            border-radius: 14px;
            margin-bottom: 12px;
            box-shadow: 0 2px 10px rgba(139, 157, 168, 0.06);
            transition: transform 0.15s, box-shadow 0.15s;
        }

        li:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(139, 157, 168, 0.12);
        }

        li .checkbox {
            width: 20px;
            height: 20px;
            flex-shrink: 0;
            cursor: pointer;
            accent-color: var(--primary);
        }

        li .task-text {
            flex: 1;
            font-size: 15px;
            color: var(--text);
            word-break: break-all;
            line-height: 1.5;
        }

        li.done {
            opacity: 0.6;
        }

        li.done .task-text {
            text-decoration: line-through;
            color: var(--done);
        }

        li .delete-btn {
            background: none;
            border: none;
            color: var(--danger);
            font-size: 20px;
            cursor: pointer;
            padding: 0 2px;
            line-height: 1;
            opacity: 0.5;
            transition: opacity 0.2s;
        }

        li .delete-btn:hover {
            opacity: 1;
        }

        .empty-tip {
            text-align: center;
            color: var(--text-muted);
            font-size: 14px;
            margin-top: 48px;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>我的待办清单</h1>
            <p class="subtitle">TODO LIST</p>
        </div>

        <div class="input-card">
            <input type="text" id="task-input" placeholder="输入要做的事情，按回车添加">
            <button id="add-btn">添加</button>
        </div>

        <ul id="task-list"></ul>
        <p class="empty-tip" id="empty-tip">还没有任务，添加一个吧</p>
    </div>

    <script>
        var listEl = document.getElementById('task-list');
        var inputEl = document.getElementById('task-input');
        var addBtn = document.getElementById('add-btn');
        var emptyTip = document.getElementById('empty-tip');
        var STORAGE_KEY = 'todo-list-tasks';

        function loadTasks() {
            var saved = localStorage.getItem(STORAGE_KEY);
            return saved ? JSON.parse(saved) : [];
        }

        function saveTasks(tasks) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
        }

        function render() {
            var tasks = loadTasks();
            listEl.innerHTML = '';
            emptyTip.style.display = tasks.length ? 'none' : 'block';

            tasks.forEach(function (task, index) {
                var li = document.createElement('li');
                if (task.done) {
                    li.className = 'done';
                }

                var checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.className = 'checkbox';
                checkbox.checked = task.done;
                checkbox.addEventListener('change', function () {
                    toggleTask(index);
                });

                var text = document.createElement('span');
                text.className = 'task-text';
                text.textContent = task.text;

                var delBtn = document.createElement('button');
                delBtn.className = 'delete-btn';
                delBtn.textContent = '×';
                delBtn.title = '删除';
                delBtn.addEventListener('click', function () {
                    deleteTask(index);
                });

                li.appendChild(checkbox);
                li.appendChild(text);
                li.appendChild(delBtn);
                listEl.appendChild(li);
            });
        }

        function addTask() {
            var value = inputEl.value.trim();
            if (!value) {
                return;
            }
            var tasks = loadTasks();
            tasks.push({ text: value, done: false });
            saveTasks(tasks);
            inputEl.value = '';
            inputEl.focus();
            render();
        }

        function toggleTask(index) {
            var tasks = loadTasks();
            tasks[index].done = !tasks[index].done;
            saveTasks(tasks);
            render();
        }

        function deleteTask(index) {
            var tasks = loadTasks();
            tasks.splice(index, 1);
            saveTasks(tasks);
            render();
        }

        addBtn.addEventListener('click', addTask);
        inputEl.addEventListener('keydown', function (e) {
            if (e.key === 'Enter') {
                addTask();
            }
        });

        render();
    </script>
</body>
</html>
